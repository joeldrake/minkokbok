<!doctype html>
<html lang="sv" class="wa-theme-default wa-palette-default wa-brand-blue wa-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#aebfa6" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Min Kokbok</title>
    <!-- Lägg till på hemskärmen: egen app i helskärm (startskärmar läggs till av vite.config.ts) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Min Kokbok" />
    <!-- Sidan ritas under statusfältet, se safe-area i theme.css -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
    <script>
      // Vald omslagsfärg (se src/theme/palette.ts), innan sidan ritas
      try {
        const palette = localStorage.getItem('mk-palette');
        if (palette) document.documentElement.dataset.palette = palette;
        // Större text (se src/theme/textSize.ts)
        if (localStorage.getItem('mk-text-size') === 'large') document.documentElement.dataset.textSize = 'large';
      } catch {}
      // Följ systemets mörkt/ljust-läge
      if (matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.replace('wa-light', 'wa-dark');
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
